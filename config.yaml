project:
  name: "rustyconnector-minecraft"
  path: "./target-project/rustyconnector-minecraft/plugin"
  tag: "v0.8.2"
  fallback_tag: "v0.9.1"

extraction:
  extractor_jar: "./extractor/extractor-core/build/libs/method-extractor-0.2.0.jar"
  min_statements: 3
  exclude_categories:
    - GETTER
    - SETTER
    - DELEGATOR
    - GENERATED
    - TEST
  output: "./results/extracted_methods.json"

dataset:
  sample_count: 100
  random_seed: 42
  output: "./results/dataset.json"

llm:
  endpoint_url: "http://localhost:8080/v1/completions"
  model_name: "qwen2.5-coder-7b"
  temperature: 0.0
  max_tokens: 512
  stop_sequences:
    - "<|fim_pad|>"
    - "<|endoftext|>"
  num_generations: 1
  seed: 42
  timeout_seconds: 300
  context_window: 16384
  max_concurrent_requests: 4

retrieval:
  retriever_jar: "./extractor/retriever/build/libs/method-retriever-0.2.0.jar"
  index_dir: "./results/lucene-index"
  top_k: 5
  max_augmentation_tokens: 4096
  max_results_in_prompt: 5
  max_body_lines: 50
  include_body: true
  near_duplicate_threshold: 0.8
  min_score_ratio: 0.3

experiment:
  modes:
    - no_augmentation
    - ordered_augmentation
    - shuffled_augmentation
    - retrieval_augmentation
  shuffle_seed: 42

compilability:
  enabled: true
  mode: "file"  # file | project
  source_version: "17"
  # java_home: "/path/to/jdk-17"  # optional, uses system javac if not set

output:
  dir: "./results"
  save_prompts: true
  save_responses: true
