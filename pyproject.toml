[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "method-gen-experiments"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-Levenshtein>=0.25",
    "tabulate>=0.9",
    "tree-sitter>=0.22,<0.23",
    "tree-sitter-java>=0.21,<0.23",
    "codebleu>=0.7",
    "torch>=2.2",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[project.scripts]
mgx = "pipeline.run:main"
mgx-analyze-retrieval = "pipeline.analyze_retrieval:main"
mgx-call-graph = "pipeline.call_graph_cli:main"
mgx-call-graph-check = "pipeline.call_graph_check:main"
mgx-call-graph-viewer = "pipeline.call_graph_viewer:main"
mgx-inspect-retrieval = "pipeline.inspect_retrieval:main"
mgx-recompute = "pipeline.recompute:main"
mgx-retrieval-viewer = "pipeline.retrieval_viewer:main"
mgx-viewer = "pipeline.viewer:main"
