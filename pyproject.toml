[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "method-gen-experiments"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-Levenshtein>=0.25",
    "tabulate>=0.9",
]

[project.scripts]
mgx = "pipeline.run:main"
