[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "method-gen-experiments"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-Levenshtein>=0.25",
    "tabulate>=0.9",
    "tree-sitter>=0.22,<0.23",
    "tree-sitter-java>=0.21,<0.23",
    "codebleu>=0.7",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[project.scripts]
mgx = "pipeline.run:main"
mgx-viewer = "pipeline.viewer:main"
mgx-recompute = "pipeline.recompute:main"
